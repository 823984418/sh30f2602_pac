[package]
name = "sh30f2602_pac"
version = "0.1.1"
edition = "2021"
description = "Peripheral access crate for the SH30F2602 MCU"
keywords = [
    "no-std",
    "embedded",
]
categories = [
    "no-std",
    "embedded",
    "hardware-support",
]
license = "MIT OR Apache-2.0"

[dependencies]
critical-section = { version = "1.2.0", optional = true }
cortex-m = "0.7.9"
cortex-m-rt = { version = "0.7.6", optional = true }
vcell = "0.1.3"
portable-atomic = { version = "1.15.0", default-features = false }

[features]
rt = ["cortex-m-rt/device"]

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

[package.metadata.docs.rs]
all-features = true
target = ["thumbv6m-none-eabi"]
rustdoc-args = ["--generate-link-to-definition"]
